name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Details ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME environment variable is not set."
            exit 1
          fi

          JAVA_RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_RAW_VERSION" ]; then
            echo "::error::Unable to detect active Java version."
            exit 1
          fi

          JAVA_MAJOR=$(echo "$JAVA_RAW_VERSION" | cut -d'.' -f1)
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(echo "$JAVA_RAW_VERSION" | cut -d'.' -f2)
          fi

          echo "Detected Java Major Version: $JAVA_MAJOR (raw: $JAVA_RAW_VERSION)"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Active Java version ($JAVA_MAJOR) is lower than required Java 17."
            exit 1
          fi
          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in workspace root."
          else
            echo "Generating temporary debug keystore using Java 17 keytool..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create temporary debug keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK."
            echo "Searching app/build/outputs/apk for any generated APKs:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" || true
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Debug APK at $EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK")
          echo "Verified APK: $EXPECTED_APK (Size: $APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_RELEASE_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$TEMP_RELEASE_DIR"

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME="android-app"
          fi
          # Sanitize repo name for safe filename
          CLEAN_REPO_NAME=$(echo "$RAW_REPO_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
          
          ASSET_NAME="${CLEAN_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_APK="$TEMP_RELEASE_DIR/$ASSET_NAME"

          cp "$SRC_APK" "$DEST_APK"

          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "::error::Failed to prepare release asset at $DEST_APK."
            exit 1
          fi

          echo "Prepared release asset: $DEST_APK"
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset file is missing or empty: $ASSET_PATH"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### 📱 Automated Debug APK Build

          This is an automatically generated debug APK built by **GitHub Actions**.

          - **Build Number:** #${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** \`${{ github.sha }}\`
          - **Asset Filename:** \`${ASSET_NAME}\`

          > **Note:** This APK is intended for testing and development. It is signed with a temporary debug keystore and is not a Play Store production release.
          EOF
          )

          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "================================================="
            echo "🎉 GitHub Release Published Successfully!"
            echo "================================================="
            
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME")
            
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"
            
            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "### ✅ GitHub Release Created Successfully"
              echo "- **Release Tag:** \`$TAG_NAME\`"
              echo "- **Direct Release URL:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Asset Filename:** \`$ASSET_NAME\`"
              echo ""
              echo "📱 **Download Instructions:**"
              echo "1. Open the [GitHub Release page]($RELEASE_URL) directly on your Android device."
              echo "2. Tap on \`$ASSET_NAME\` under the **Assets** section to download and install the APK."
              echo ""
              echo "📦 **Backup Artifact:** The standard GitHub Actions artifact \`app-debug-apk\` is also available from this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete."
            echo "APK build and artifact upload succeeded. The APK is safely preserved as a workflow artifact."

            {
              echo "## ⚠️ Debug APK Build & Release Summary"
              echo ""
              echo "### ✅ APK Build Succeeded"
              echo "The debug APK was built successfully and is preserved as a workflow artifact."
              echo ""
              echo "### ⚠️ Release Publishing Notice"
              echo "Publishing directly to GitHub Releases did not complete (e.g. workflow permissions or existing tag)."
              echo ""
              echo "📦 **How to Download:**"
              echo "Download the verified APK directly from the **Artifacts** section of this GitHub Actions run under the name \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
